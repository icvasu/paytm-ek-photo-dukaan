<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900" role="img" aria-label="Sample printed rate card for Ramesh Tea and Snacks listing twelve priced items">
  <!--
    Sample fixture for the demo. Every glyph outside ASCII is written as a
    numeric character reference: the earlier version of this file carried raw
    bytes that were not valid XML, so browsers rendered nothing at all.

    Prices here must stay equal to TEA_COUNTER_ITEMS in
    src/services/vision/VisionService.ts. A judge who compares the picture with
    the loaded catalog should find the same numbers.
  -->
  <rect width="700" height="900" fill="#fff8dc"/>
  <rect x="35" y="35" width="630" height="830" rx="18" fill="#173f35" stroke="#9b6b3e" stroke-width="18"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="350" y="108" font-size="40" font-weight="700">RAMESH TEA &amp; SNACKS</text>
    <text x="350" y="152" font-size="24" fill="#facc15">&#2352;&#2350;&#2375;&#2358; &#2330;&#2366;&#2351; &#2344;&#2366;&#2358;&#2381;&#2340;&#2366;</text>
    <text x="350" y="192" font-size="20" fill="#d1fae5">RATE CARD</text>
  </g>
  <path d="M85 212h530" stroke="#facc15" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff">
    <text x="80" y="262">Masala Chai</text><text x="330" y="262" text-anchor="end">&#8377;10</text>
    <text x="80" y="322">Samosa</text><text x="330" y="322" text-anchor="end">&#8377;15</text>
    <text x="80" y="382">Water Bottle 1 L</text><text x="330" y="382" text-anchor="end">&#8377;20</text>
    <text x="80" y="442">Thums Up 750 ml</text><text x="330" y="442" text-anchor="end">&#8377;45</text>
    <text x="80" y="502">Limca 750 ml</text><text x="330" y="502" text-anchor="end">&#8377;40</text>
    <text x="80" y="562">Parle-G Biscuit</text><text x="330" y="562" text-anchor="end">&#8377;10</text>
    <text x="80" y="622">Filter Coffee</text><text x="330" y="622" text-anchor="end">&#8377;25</text>
    <text x="80" y="682">Poha Plate</text><text x="330" y="682" text-anchor="end">&#8377;30</text>
    <text x="380" y="262">Idli Plate</text><text x="620" y="262" text-anchor="end">&#8377;35</text>
    <text x="380" y="322">Mango Juice</text><text x="620" y="322" text-anchor="end">&#8377;50</text>
    <text x="380" y="382">Veg Sandwich</text><text x="620" y="382" text-anchor="end">&#8377;60</text>
    <text x="380" y="442">Chai + Samosa</text><text x="620" y="442" text-anchor="end">&#8377;22</text>
  </g>
  <path d="M85 730h530" stroke="#facc15" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="350" y="782" font-size="26" font-weight="700" fill="#facc15">SAMPLE IMAGE</text>
    <text x="350" y="818" font-size="19" fill="#d1fae5">Ships with the prototype &#183; rows are pre-written,</text>
    <text x="350" y="842" font-size="19" fill="#d1fae5">not read out of this picture</text>
  </g>
</svg>
