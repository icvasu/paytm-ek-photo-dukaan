  <text x="450" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bfdbfe">&#2350;&#2368;&#2344;&#2366; &#2325;&#2367;&#2352;&#2366;&#2344;&#2366;</text>
  <g fill="#6f452c">
