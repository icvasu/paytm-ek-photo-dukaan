    Sample fixture for the demo. Non-ASCII glyphs are numeric character
    references so this file stays valid XML; a raw-byte version rendered as a
    blank image in the browser.

    Prices must stay equal to MEENA_SHELF_ITEMS in
    src/services/vision/VisionService.ts.
  -->
